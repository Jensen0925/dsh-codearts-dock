# Offline checks on every push and pull request. Publishing lives in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Offline suites
        run: pnpm test

      - name: Release metadata
        run: pnpm run check:release

      - name: Package privacy and entry checks
        run: pnpm run check:package

      - name: Packed file list
        run: |
          pack_dir="$RUNNER_TEMP/dsh-codearts-pack"
          mkdir -p "$pack_dir"
          pnpm pack --pack-destination "$pack_dir"
          tar -tzf "$pack_dir"/*.tgz
