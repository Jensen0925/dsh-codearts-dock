# Offline checks on every push and pull request. Publishing lives in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        # The lockfile is deliberately not committed (the Host owns resolution),
        # so `npm ci` has nothing to read.
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Offline suites
        run: npm test

      - name: Release metadata
        run: npm run check:release

      - name: Packed file list
        run: npm pack --dry-run
